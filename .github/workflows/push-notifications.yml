name: ShipMate Push Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deliver pending FCM notifications
        env:
          FIREBASE_PROJECT_ID: shipmate-cruise-social-2026
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node relay/push-notifications.mjs
